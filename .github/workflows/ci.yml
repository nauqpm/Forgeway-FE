name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, production]

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5512

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build check (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          build-args: NEXT_PUBLIC_API_URL=http://localhost:5512
          cache-from: type=gha
          cache-to: type=gha,mode=max
