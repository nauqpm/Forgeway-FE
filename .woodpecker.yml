when:
  - event: [push, pull_request, manual]
    branch: [dev, production]

steps:
  test-and-build:
    image: node:20-alpine
    commands:
      - npm ci
      - NEXT_PUBLIC_API_URL=http://localhost:5512 npm run build

  deploy-to-vps:
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: vps_host
      username:
        from_secret: vps_user
      password:
        from_secret: vps_password
      my_token:
        from_secret: ghcr_token
      envs:
        - PLUGIN_MY_TOKEN
      script:
        - rm -rf /tmp/build-frontend
        - git clone -b production --single-branch https://${PLUGIN_MY_TOKEN}@github.com/automationland-DEV/AL-SDLC-Platform-FE.git /tmp/build-frontend
        - cd /tmp/build-frontend
        - docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:5512 -t ghcr.io/automationland-dev/sdlc-platform-frontend:latest .
        - cd /opt/sdlc
        - docker compose up -d --no-deps frontend
        - rm -rf /tmp/build-frontend
        - docker image prune -f
        - |
          for i in $(seq 1 12); do
            CONTAINER=$(docker compose ps -q frontend 2>/dev/null | head -1)
            STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER" 2>/dev/null)
            RESTARTS=$(docker inspect --format='{{.RestartCount}}' "$CONTAINER" 2>/dev/null)
            if [ "${RESTARTS:-0}" -gt 0 ]; then
              echo "DEPLOY FAILED: frontend restarted ${RESTARTS} time(s) - crash loop detected"
              docker compose logs --tail=30 frontend
              exit 1
            fi
            if [ "$STATUS" = "running" ]; then
              echo "Frontend deployed OK (restarts=0, attempt=$i): $(date)"
              exit 0
            fi
            echo "Waiting... attempt $i/12 (status=${STATUS:-unknown})"
            sleep 5
          done
          echo "DEPLOY FAILED: frontend did not reach running state after 60s"
          docker compose logs --tail=30 frontend
          exit 1
    when:
      - event: [push, manual]
        branch: production
