when:
  - event: [push, pull_request, manual]
    branch: [dev, production]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 1

steps:
  test-and-build:
    image: node:20-alpine
    commands:
      - npm ci
      - NEXT_PUBLIC_API_URL=https://api-sdlc-platform.automationland.vn npm run build
    when:
      - event: [pull_request]

  prepare-scp:
    image: alpine
    commands:
      - rm -rf .git
    when:
      - event: [push, manual]
        branch: production

  copy-to-vps:
    image: appleboy/drone-scp
    settings:
      host:
        from_secret: vps_host
      username:
        from_secret: vps_user
      password:
        from_secret: vps_password
      target: /opt/sdlc/AL-SDLC-Platform-FE
      source:
        - .
      rm: true
    when:
      - event: [push, manual]
        branch: production

  deploy-to-vps:
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: vps_host
      username:
        from_secret: vps_user
      password:
        from_secret: vps_password
      command_timeout: 30m
      script:
        - set -e
        - cd /opt/sdlc/AL-SDLC-Platform-FE
        - docker build --build-arg NEXT_PUBLIC_API_URL=https://api-sdlc-platform.automationland.vn -t ghcr.io/automationland-dev/sdlc-platform-frontend:latest .
        - cd /opt/sdlc
        - docker compose up -d --no-deps frontend
        - docker image prune -f
        - |
          for i in $(seq 1 12); do
            CONTAINER=$(docker compose ps -q frontend 2>/dev/null | head -1)
            STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER" 2>/dev/null)
            RESTARTS=$(docker inspect --format='{{.RestartCount}}' "$CONTAINER" 2>/dev/null)
            if [ "${RESTARTS:-0}" -gt 0 ]; then
              echo "DEPLOY FAILED: frontend restarted ${RESTARTS} time(s) - crash loop detected"
              docker compose logs --tail=30 frontend
              exit 1
            fi
            if [ "$STATUS" = "running" ]; then
              echo "Frontend deployed OK (restarts=0, attempt=$i): $(date)"
              exit 0
            fi
            echo "Waiting... attempt $i/12 (status=${STATUS:-unknown})"
            sleep 5
          done
          echo "DEPLOY FAILED: frontend did not reach running state after 60s"
          docker compose logs --tail=30 frontend
          exit 1
    when:
      - event: [push, manual]
        branch: production
