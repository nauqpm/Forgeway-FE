when:
  - event: [push, pull_request, manual]
    branch: [dev, production]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 1

steps:
  test-and-build:
    image: node:20-alpine
    commands:
      - npm ci
      - NEXT_PUBLIC_API_URL=https://api-sdlc-platform.automationland.vn npm run build
    when:
      - event: [pull_request]

  deploy-to-vps:
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: vps_host
      username:
        from_secret: vps_user
      password:
        from_secret: vps_password
      command_timeout: 30m
      script:
        - set -e
        - cd /home/sdlc
        - eval $(ssh-agent -s)
        - ssh-add ~/.ssh/id_rsa || true
        - docker compose build --no-cache frontend-u
        - docker compose up -d frontend-u
        - docker image prune -f
    when:
      - event: [push, manual]
        branch: production
